name: Puente Apollo ↔ HubSpot

# Apollo envía los correos y HubSpot lleva el pipeline. Este job es lo único
# que los une: inscribe leads en las secuencias, trae el estado de vuelta y
# corta la cadencia cuando alguien agenda reunión con Amaia.
#
# Arranca en simulacro: hasta que la variable BRIDGE_ENABLED valga "1" el
# script solo escribe en el log lo que haría.

on:
  schedule:
    - cron: '20 * * * *'      # cada hora, en el minuto 20
    # GitHub retrasa o se salta pasadas programadas sin avisar (el 16/10
    # faltaron cuatro seguidas; el 19/10, seis horas sin pasada). Un segundo
    # horario a otro minuto reduce los huecos; la concurrencia de abajo
    # impide que dos pasadas coincidan y el puente es idempotente.
    - cron: '50 * * * *'
  workflow_dispatch:
    inputs:
      enabled:
        description: 'Escribir de verdad (1) o solo simular (0)'
        required: false
        default: '0'

concurrency:
  group: apollo-bridge         # nunca dos pasadas a la vez
  cancel-in-progress: false

jobs:
  puente:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar el puente
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          BRIDGE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.enabled || vars.BRIDGE_ENABLED }}
          # La variable OUTBOUND_ENABLED del repositorio estaba a 0 desde la
          # pausa de septiembre y dejaba el relanzamiento sin inscripciones sin
          # que nadie lo viera. Desde el 16/10 va fija a 1: el interruptor de
          # verdad es la secuencia en Apollo (pausada = no sale nada) y, para
          # todo el puente, BRIDGE_ENABLED.
          OUTBOUND_ENABLED: '1'
          # Relanzamiento del 14/10 con la lista verificada a mano. El tope de
          # verdad está en Apollo: la secuencia OUTBOUND tiene max_emails_per_day
          # = 8 desde el 20/10 (antes 5), y eso cuenta TODO lo que sale
          # (primeros correos y seguimientos). Este número solo dice cuántos
          # ayuntamientos NUEVOS inscribe el puente por día laborable; cada uno
          # son 5 correos más en la misma cola de Apollo, que con 70 a medio
          # camino ya va llena. Ver bridge/README.md, «El tope diario».
          OUTBOUND_DAILY_CAP: '2'
          # Correos al día de la secuencia OUTBOUND en Apollo, seguimientos
          # incluidos: 8 desde el 20/10 (pedido por el usuario; antes 5). La
          # fase TOPE lo comprueba en cada pasada y lo corrige en Apollo si
          # no coincide. Este es el sitio donde se cambia.
          OUTBOUND_MAX_EMAILS_PER_DAY: '8'
          OUTBOUND_ENROLL_HOUR: ${{ vars.OUTBOUND_ENROLL_HOUR || '8' }}
          # Receptor propio de aperturas (tracking/README.md). La URL es la de
          # la aplicación web de Apps Script, termina en /exec. La clave es el
          # secreto APERTURAS_KEY del repositorio (Settings → Secrets and
          # variables → Actions) y tiene que ser la misma que la propiedad
          # CLAVE del script. Solo protege la lectura de la hoja; hasta el
          # 16/10 estuvo escrita aquí y por eso se cambió.
          APERTURAS_URL: 'https://script.google.com/macros/s/AKfycbxGCY4zJU395WGvBjVsRZxMXnXwm_jC0-h2os7ZTISnWZpoN-60HaXAeqaqy76SOIf7/exec'
          APERTURAS_KEY: ${{ secrets.APERTURAS_KEY }}
          # La fase PANEL genera la página del panel con los datos dentro y la
          # manda al receptor (?panel=1). Además deja aquí una copia cifrada
          # (clave derivada del token de HubSpot), que el paso de abajo sube
          # como artefacto: así se puede recoger la página de la pasada sin
          # pasar por el receptor (bridge/descifrar_panel.py). Cifrada porque
          # el repositorio es público y el panel lleva nombres y correos de
          # los ayuntamientos.
          PANEL_SALIDA: ${{ runner.temp }}/panel/relanzamiento.bin
        run: python3 bridge/apollo_hubspot_bridge.py

      - name: Guardar el panel de la pasada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel
          path: ${{ runner.temp }}/panel/relanzamiento.bin
          retention-days: 2
          if-no-files-found: ignore
