name: Puente Apollo ↔ HubSpot

# Apollo envía los correos y HubSpot lleva el pipeline. Este job es lo único
# que los une: inscribe leads en las secuencias, trae el estado de vuelta y
# corta la cadencia cuando alguien agenda reunión con Amaia.
#
# Arranca en simulacro: hasta que la variable BRIDGE_ENABLED valga "1" el
# script solo escribe en el log lo que haría.

on:
  schedule:
    - cron: '20 * * * *'      # cada hora, en el minuto 20
  workflow_dispatch:
    inputs:
      enabled:
        description: 'Escribir de verdad (1) o solo simular (0)'
        required: false
        default: '0'

concurrency:
  group: apollo-bridge         # nunca dos pasadas a la vez
  cancel-in-progress: false

jobs:
  puente:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar el puente
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          BRIDGE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.enabled || vars.BRIDGE_ENABLED }}
          OUTBOUND_ENABLED: ${{ vars.OUTBOUND_ENABLED || '1' }}
          # A 6 desde el 16/09 por entregabilidad: el buzón se conectó el 07/09
          # y pasar de 6 a 30 correos/día de golpe es un salto brusco para un
          # buzón tan joven. Además los rebotes duros iban al 3,7% (2 de 54),
          # por encima del aviso del 3% de Apollo y a un pelo del 4% con el que
          # pausa la secuencia sola en cuanto se superen 200 envíos.
          #
          # OJO al volver a subirlo: las dos tandas de 30 del 15 y 16/09 siguen
          # generando seguimientos, y sus días de paso (+5, +10, +16, +23) ya
          # ocupan el buzón entero. Sumarles inscripciones nuevas desborda el
          # tope de 30/día y los seguimientos se retrasan. Lo sano es no volver
          # a subir hasta que esas dos tandas terminen su cadencia (~8/10).
          #
          # Lo que sigue documenta la cuenta del modo vaciado, por si algún día
          # se vuelve a él con el buzón ya curtido y la lista limpia:
          # MODO VACIADO. El buzón de Amaia manda 30 correos/día y cada
          # ayuntamiento consume 5 (pasos en día 0, +5, +10, +16, +23), así que
          # el techo SOSTENIDO son 6 inscripciones/día (6 × 5 = 30). Con 6 el
          # buzón se quedaba a medias durante las primeras 3 semanas: el día 1
          # solo salen 6 correos de los 30 que caben, porque los seguimientos
          # aún no han arrancado.
          #
          # La lista es finita (~127 pendientes), así que a 30/día se agota en
          # 5 días y a partir de ahí los seguimientos de esas 5 tandas rellenan
          # el buzón a 30/día exactos, sin pasarse ni un correo:
          #   día 0-4   30/día  correo 1 de cada tanda
          #   día 5-9   30/día  correo 2 (ya no quedan inscripciones nuevas)
          #   día 10-14 30/día  correo 3     día 16-20  correo 4
          #   día 23-27 30/día  correo 5
          # Toda la lista recibe el primer correo en 5 días en vez de 22.
          #
          # OJO: esto vale para VACIAR una lista cerrada. Si la lista pasa a
          # recibir contactos nuevos de forma continua, 30 inscripciones/día
          # piden 150 correos/día y el buzón no da: los seguimientos se
          # acumularían en cola y el correo 2 llegaría tarde. En ese caso hay
          # que volver a 6 o conectar más buzones a la secuencia.
          OUTBOUND_DAILY_CAP: '6'
          OUTBOUND_ENROLL_HOUR: ${{ vars.OUTBOUND_ENROLL_HOUR || '8' }}
          # Buzón exacto desde el que sale el correo en frío. Cuando se mueva
          # al dominio de outbound, se pone aquí (variable del repo) y el
          # puente se niega a arrancar si ese buzón no está conectado en
          # Apollo: así no vuelve a salir nada desde el dominio corporativo
          # porque alguien cambie el "buzón por defecto" en Apollo.
          OUTBOUND_SENDER_EMAIL: ${{ vars.OUTBOUND_SENDER_EMAIL || '' }}
          # Tope de rebotes de la secuencia a partir del cual el puente deja
          # de inscribir. 3 es el umbral de aviso de Apollo; Apollo solo
          # pausa sola al 4 % y a partir de 200 envíos, tarde para nosotros.
          OUTBOUND_MAX_BOUNCE_PCT: ${{ vars.OUTBOUND_MAX_BOUNCE_PCT || '3' }}
        run: python3 bridge/apollo_hubspot_bridge.py
